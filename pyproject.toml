[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "envelopelab"
version = "0.1.0"
description = "Envelope design schema and material library"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "EnvelopeLab Contributors"}]
dependencies = [
  "ezdxf>=1.3",
  "gmsh>=4.11",
  "numpy>=1.26",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  # The compiled solver kernel is tested against the NumPy one (tests/unit/test_solver_kernels.py).
  "numba>=0.60",
]
# Desktop application (app/envelopelab_app). See ADR-0007.
gui = [
  "PySide6>=6.6",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
# Optional: compiled element kernel of the preview solver, 3-4x faster solves; results are
# the same as without it (NumPy path). See ADR-0019.
fast = [
  "numba>=0.60",
]
# Optional: Open3D point-to-plane ICP for reference-mesh registration (a SciPy ICP is used
# without it). See ADR-0006.
registration = [
  "open3d>=0.18",
]
# CalculiX (the verification solver) is an external program, not a Python package:
# see docs/dev/calculix-installation.md.
scan = []

[project.scripts]
envelopelab-import = "envelopelab.assembly.pipeline:main"

[project.gui-scripts]
envelopelab = "envelopelab_app.application:main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running test, excluded from the fast suite with -m 'not slow'",
]
# GUI tests run headless (offscreen Qt platform); see tests/gui/conftest.py.
qt_api = "pyside6"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.isort]
# The CalculiX adapter lives in solvers/ but is part of this project.
known-first-party = ["envelopelab", "calculix_adapter", "envelopelab_app"]

[tool.mypy]
# No python_version pin: each CI job checks against its own interpreter. Pinning 3.11 made
# mypy parse numpy >= 2.5 stubs (3.12-only `type` statements) as 3.11 code on 3.12 runners.
# The 3.11 job and ruff's target-version still enforce 3.11 compatibility.
strict = true
packages = ["envelopelab", "calculix_adapter", "envelopelab_app"]

[[tool.mypy.overrides]]
# SciPy ships no type information; its results are converted with np.asarray at the call site.
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Open3D (optional, reference-mesh registration) ships no type information.
module = ["open3d", "open3d.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyvistaqt and VTK ship no (complete) type information; the 3D view isolates them.
module = ["pyvistaqt", "pyvistaqt.*", "vtkmodules", "vtkmodules.*", "pyvista", "pyvista.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The Gmsh Python API (a ctypes wrapper) ships no type information.
module = ["gmsh"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/envelopelab", "solvers/calculix_adapter", "app/envelopelab_app"]
