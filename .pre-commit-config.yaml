# The hooks run the project's own ruff and mypy from the active virtualenv (activate
# .venv before committing), so they use the same versions and settings as
# scripts/verify.py and CI. Isolated hook environments cannot see numpy, pytest or
# PySide6, which strict mypy needs.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: python -m mypy src solvers app tests
        language: system
        types: [python]
        pass_filenames: false
