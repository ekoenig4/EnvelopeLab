name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # GUI tests run headless (tests/gui); the renderer test sets its own platform.
  QT_QPA_PLATFORM: offscreen

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Gmsh system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
      - name: Install Qt and VTK system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0
      - name: Install CalculiX verification solver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y calculix-ccx
          ccx -v || true  # prints the version; exits with a nonzero code
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,gui]"
      - name: Install Open3D registration backend (Linux, optional)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libegl1 libusb-1.0-0
          python -m pip install -e ".[registration]"
      - name: Verify
        run: python scripts/verify.py
