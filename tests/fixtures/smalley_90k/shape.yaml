# EnvelopeLab shape file: the "Smalley 90K" natural-shape gore layout.
#
# TEST DATA ONLY (AGENTS.md: reference designs live in tests/fixtures/). Transcribed from
# source/Smalley_90K.xlsx (stored unmodified); tests/regression/test_shape_fixtures.py
# checks every number below against that spreadsheet. Format: docs/formats/shape-file.md.
#
# How to read it
# --------------
# * `profile` is the shape: radius r at station s along the load tape, both as fractions
#   of the pole-to-pole gore length L. Scaling L scales the whole balloon.
# * `stations` names the stations the spreadsheet marks (fractions of L).
# * `design.hold` lists the three values that fix this design; everything else (height,
#   diameters, envelope volume, ...) is computed. To make a variant, swap a held value
#   for another one, e.g. hold `mouth_diameter: 6 m` instead of `nominal_volume` and the
#   program solves for the gore length (and so the volume and height).
# * Numbers with a unit are converted to SI on load (m, mm, cm, ft, in; m^3, ft^3).

format: envelopelab.shape
format_version: 1
name: Smalley 90K
description: >-
  20-gore natural-shape envelope, 92,000 ft^3 nominal, from the Balloon Builders Journal
  gore-layout method (Issues 1 and 22).
source:
  file: source/Smalley_90K.xlsx
  reference: Balloon Builders Journal, Issues 1 and 22 (gore layout instructions)

profile:
  source: datasheet        # published normalized table (BBJ), not measured
  # [s, r]: s = 0 at the bottom pole, s = 1 at the top pole.
  stations:
    - [0.00, 0.00000]
    - [0.02, 0.01535]
    - [0.04, 0.03071]
    - [0.06, 0.04605]
    - [0.08, 0.06138]
    - [0.10, 0.07669]
    - [0.12, 0.09195]
    - [0.14, 0.10716]   # spreadsheet: "Mouth"
    - [0.16, 0.12228]
    - [0.18, 0.13730]
    - [0.20, 0.15218]
    - [0.22, 0.16689]
    - [0.24, 0.18139]
    - [0.26, 0.19564]
    - [0.28, 0.20959]
    - [0.30, 0.22317]
    - [0.32, 0.23633]
    - [0.34, 0.24900]
    - [0.36, 0.26109]
    - [0.38, 0.27251]
    - [0.40, 0.28316]
    - [0.42, 0.29295]
    - [0.44, 0.30175]
    - [0.46, 0.30945]
    - [0.48, 0.31591]
    - [0.50, 0.32100]
    - [0.52, 0.32461]
    - [0.54, 0.32662]
    - [0.56, 0.32691]   # spreadsheet: "Equator"
    - [0.58, 0.32540]
    - [0.60, 0.32203]
    - [0.62, 0.31677]
    - [0.64, 0.30962]
    - [0.66, 0.30064]
    - [0.68, 0.28989]
    - [0.70, 0.27751]
    - [0.72, 0.26364]
    - [0.74, 0.24844]
    - [0.76, 0.23210]   # spreadsheet: "Chute ties"
    - [0.78, 0.21480]
    - [0.80, 0.19673]
    - [0.82, 0.17805]
    - [0.84, 0.15891]
    - [0.86, 0.13944]
    - [0.88, 0.11974]   # spreadsheet: "Parachute Over lap"
    - [0.90, 0.09989]   # spreadsheet: "Vent Openig"
    - [0.92, 0.07997]
    - [0.94, 0.05999]
    - [0.96, 0.04000]
    - [0.98, 0.02000]
    - [1.00, 0.00000]

stations:
  mouth: 0.14
  equator: 0.56
  chute_ties: 0.76
  parachute_overlap: 0.88   # the parachute overlaps the envelope from here to the vent
  vent: 0.90

design:
  hold:
    nominal_volume: 92000 ft^3   # spreadsheet VOLUME: closed shape, pole to pole
    mouth_station: mouth
    top_station: vent
  gore_count: 20
  # Cut allowance per gore edge. The spreadsheet's SEAM ALLOWANCE is 1 in, and its cut
  # half gore is the sewn half gore + 2 x 1 in, i.e. 2 in on each edge.
  seam_allowance: 2 in

# Values the spreadsheet computes, kept for regression checks only (never inputs).
published:
  volume_coefficient: {value: 0.12586, source: datasheet}   # V = c L^3 (spreadsheet G4)
  gore_length: 90.0810 ft                  # L = (V / c)^(1/3)
  seam_allowance: 1 in
  stations:
    mouth: {radius: 9.6531 ft, sewn_half_gore: 18.1957 in, cut_half_gore: 20.1957 in}
    equator: {radius: 29.4484 ft, sewn_half_gore: 55.5090 in, cut_half_gore: 57.5090 in}
    chute_ties: {radius: 20.9078 ft, sewn_half_gore: 39.4104 in, cut_half_gore: 41.4104 in}
    parachute_overlap: {radius: 10.7863 ft, sewn_half_gore: 20.3317 in, cut_half_gore: 22.3317 in}
    vent: {radius: 8.9982 ft, sewn_half_gore: 16.9612 in, cut_half_gore: 18.9612 in}
