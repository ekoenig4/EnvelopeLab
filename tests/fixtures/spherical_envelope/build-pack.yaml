# Generic spherical envelope: 12 gores x 5 rows of a 7 m radius sphere between latitudes
# -72 deg (mouth) and +78 deg (crown ring). Synthetic design, generated by
# tests/fixtures/generate_generic_fixtures.py. Used by the preview-solver smoke solve.
import:
  mapping_version: generic-spherical-envelope/1
  units: auto
  seam_allowance_mm: 25
  default_grain: [1.0, 0.0]
  layers:
    cut: [CUT]
    sew: [SEW]
    label: [NOTES]
  labels:
    - pattern: '^PANEL\s+(?P<panel>[A-Z])\s+x(?P<quantity>\d+)$'
  sources:
    - file: gores.dxf

assembly:
  kind: standard_gore
  rings:
    - name: body
      gore_count: 12
      rows: [A, B, C, D, E]
      bottom: {name: mouth, kind: mouth, hem: {load_tape: mouth webbing}}
      top: {name: crown, kind: parachute_opening, hem: {load_tape: crown ring tape}}
      horizontal_seam: {allowance_mm: 25, construction_order: 1}
      vertical_seam: {allowance_mm: 25, load_tape: vertical load tape, construction_order: 2}
  mesh:
    target_edge_length_mm: 1000
